[project]
name = "repo-autofix-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GaoBW123", email = "2096397627@qq.com" }
]
requires-python = ">=3.9"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.128.8",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.11",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "tree-sitter>=0.23.2",
